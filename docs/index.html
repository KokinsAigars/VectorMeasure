<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>VectorMeasure</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./style.css" />
</head>

<body>

    <div class="flex-row">
        <div class="f-r-a fra-r">
            <label> 📐 Recalibrate:
                <input class="input" id="real-length" type="number" step="0.01" value="10" />
            </label>
            <button class="btn" id="calibrate-btn">Calibrate</button>
        </div>
        <div class="f-r-a fra-r">
            <label for="calibration-number">Calibration Number (e.g. 53) </label>
            <input type="text" id="calibration-number" name="calibrationNumber" />
        </div>
    </div>

    <div class="flex-row">
        <div class="f-r-a fra-r">
            <button class="btn" id="measure-btn" aria-pressed="false" data-mode="off">📏 Measure Distance</button>
        </div>
        <div class="f-r-a fra-r">
            <button class="btn" id="zoom-in-btn">➕ Zoom In</button>
        </div>
        <div class="f-r-a fra-r">
            <button class="btn" id="zoom-out-btn">➖ Zoom Out</button>
        </div>
        <div class="f-r-a fra-r">
            <button class="btn" id="reset-pdf-btn">🔄 Reset View</button>
        </div>
        <div class="f-r-a fra-r">
            <button class="btn" id="save-btn">💾 Save as PNG</button>
        </div>
    </div>

    <div class="flex-row">
        <div class="f-r-a fra-r">
            <button class="btn" id="add-line-btn" aria-pressed="false" data-mode="off">Line</button>
        </div>
        <div class="f-r-a fra-r">
            <button class="btn" id="delete-line-btn" aria-pressed="false" data-mode="off">Delete Line</button>
        </div>
        <div class="f-r-a fra-r">
            <button class="btn" id="add-comment-btn" aria-pressed="false" data-mode="off">Comment</button>
        </div>
    </div>


    <div id="measurement-tip"></div>
<!--    <div id="scale-indicator"></div>-->

    <div id="pdf-container"></div>


    <div class="flex-row">
        <div class="f-r-a fra-r">
            <div class="info-margin">
                <pre><code id="info" style="margin-top: 20px"></code></pre>
            </div>
        </div>
    </div>

    <div class="flex-row">
        <div class="f-r-a fra-r">
            <label for="pdf-selector">select plane: </label>
            <select class="pdf-selector" id="pdf-selector" name="pdf">
                <option value="PLANS_Tukums">TUKUMS</option>
                <option value="PLANS_CUBE">CUBE</option>
            </select>
        </div>
        <div class="f-r-a fra-r">
            <button class="btn" id="clr-buffer">clr buffer</button>
        </div>
    </div>


    <script src="./js/pdfjs/pdf.mjs" type="module"></script>
    <script src="./js/app.js" type="module"></script>

</body>

</html>

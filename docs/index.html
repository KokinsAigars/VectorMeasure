<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>VectorMeasure</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./style.css" />
</head>

<body>

    <div class="flex-row">
        <div class="fra">
            <button class="btn" id="zoom-in-btn">➕ Zoom In</button>
        </div>
        <div class="fra">
            <button class="btn" id="zoom-out-btn">➖ Zoom Out</button>
        </div>
<!--        <div class="fra">-->
<!--            <button class="btn" id="zoom-all-btn">🗔 Zoom All</button>-->
<!--        </div>-->
        <div class="fra">
            <button class="btn" id="pan-btn">Pan</button>
        </div>
        <div class="fra">
            <button class="btn" id="reset-pdf-btn">🔄 Reset View</button>
        </div>
        <div class="fra">
            <button class="btn" id="flip-pdf-horizontal-btn">↔️ Flip Horizontally</button>
        </div>
        <div class="fra">
            <button class="btn" id="flip-pdf-vertical-btn">↕️ Flip Vertically</button>
        </div>
    </div>

    <div class="flex-row">
        <div class="fra">
            <button class="btn" id="measure-btn" aria-pressed="false" data-mode="off">📏 Measure Distance</button>
        </div>
        <div class="fra">
            <button class="btn" id="add-line-btn" aria-pressed="false" data-mode="off">Line</button>
        </div>
        <div class="fra">
            <button class="btn" id="delete-line-btn" aria-pressed="false" data-mode="off">Delete Line</button>
        </div>
        <div class="fra">
            <button class="btn" id="add-comment-btn" aria-pressed="false" data-mode="off">Comment</button>
        </div>
        <div class="fra">
            <button class="btn" id="save-png-btn">💾 Save Image</button>
        </div>
        <div class="fra">
            <button class="btn" id="save-json-btn">💬 Export Comments</button>
        </div>
    </div>

    <div class="flex-row">
        <div class="fra">
            <label> 📐 Recalibrate:
                <input class="input" id="real-length" type="number" step="0.01" value="10" />
            </label>
            <button class="btn" id="calibrate-btn">Calibrate</button>
        </div>
        <div class="info-margin">
            <pre><code id="info" style="margin-top: 20px"></code></pre>
        </div>
    </div>

    <div id="pdf-container"></div>

    <div id="measurement-tip"></div>

<!--    <script type="module" src="./js/libs/dexie/dexie.js" ></script>-->
    <script type="module" src="./js/libs/pdfjs/pdf.mjs" ></script>
    <script type="module" src="./js/app.js"></script>

</body>

</html>

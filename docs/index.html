<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>VectorMeasure</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./style.css" />
</head>

<body>

    <div class="cls_sel">
        <label for="pdf-selector">select plane: </label>
        <select class="pdf-selector" id="pdf-selector" name="pdf">
            <option value="PLANS_Tukums">TUKUMS</option>
            <option value="PLANS_CUBE">CUBE</option>
            <option value="PLANS_Tukums_reverse">TUKUMS REVERSE</option>
        </select>
<!--        <button class="btn" id="clr-buffer">clr buffer</button>-->
    </div>

    <div id="toolbar">
        <button class="btn" id="save-btn">💾 Save as PNG</button>
        <button class="inline-block cursor-pointer rounded-md bg-gray-500 px-4 py-3 text-center text-sm font-semibold uppercase text-white transition duration-200 ease-in-out hover:bg-gray-900"
                id="measure-btn">📏 Measure Distance</button>
        <button class="btn" id="clear-btn">🧹 Clear Measurements</button>
        <button class="btn" id="reset-pdf-btn">🔄 Reset View</button>
        <button class="btn" id="flip-pdf-horizontal-btn">↔️ Flip Horizontally</button>
<!--        <button class="btn" id="flip-pdf-vertical-btn">↕️ Flip Vertically</button>-->
        <button class="btn" id="zoom-in-btn">➕ Zoom In</button>
        <button class="btn" id="zoom-out-btn">➖ Zoom Out</button>
        <button class="btn" id="zoom-reset-btn">Zoom RESET</button>
<!--        <button class="btn" id="pan-toggle-btn">Pan</button>-->
    </div>

    <div id="toolbar2">
        <label> 📐 Recalibrate:
          <input class="input" id="real-length" type="number" step="0.01" value="10" />
        </label>
        <button class="btn" id="calibrate-btn">Calibrate</button>
        <div class="info-margin">
          <pre><code id="info" style="margin-top: 20px"></code></pre>
        </div>
    </div>

    <div id="measurement-tip"></div>
    <div id="scale-indicator"></div>


    <div id="pdf-container"></div>

    <script src="./js/pdfjs/pdf.mjs" type="module"></script>
    <script src="./js/app.js" type="module"></script>

</body>

</html>

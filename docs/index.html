<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>VectorMeasure</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./style.css" />
</head>

<body>

    <div class="toolbar">
        <button class="btn btn--ghost btn--icon-only" aria-label="Zoom In" id="zoom-in-btn">➕</button>
        <button class="btn btn--ghost btn--icon-only" aria-label="Zoom Out" id="zoom-out-btn">➖</button>
        <button class="btn btn--outline" id="zoom-all-btn">
            Zoom All
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 21l-4.3-4.3M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <button class="btn" aria-label="Pan" id="pan-btn">🖐️</button>
        <button class="btn" id="reset-pdf-btn">🔄 Reset View</button>
        <button class="btn" id="flip-pdf-horizontal-btn">↔️ Flip Horizontally</button>
        <button class="btn" id="flip-pdf-vertical-btn">↕️ Flip Vertically</button>
    </div>

    <div class="toolbar">
        <button class="btn btn--primary btn--lg" id="measure-btn" aria-pressed="false" data-mode="off">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            📏 Measure Distance
        </button>
        <button class="btn btn--primary btn--lg" aria-label="Draw" id="add-line-btn" aria-pressed="false" data-mode="off">✏️ LINE</button>
        <button class="btn btn--primary btn--lg" aria-label="Delete" id="delete-line-btn" aria-pressed="false" data-mode="off">Delete Line</button>
        <button class="btn btn--primary btn--lg" aria-label="Comment" id="add-comment-btn" aria-pressed="false" data-mode="off">Comment</button>
        <pre><code id="info" style="margin-top: 20px"></code></pre>
    </div>

    <div id="pdf-container"></div>

    <div id="measurement-tip"></div>

    <div class="toolbar">
        <label class="input-label"> 📐 Recalibrate:
            <input class="input" id="real-length" type="number" step="0.01" value="10" />
        </label>
        <button class="btn" id="calibrate-btn">Calibrate</button>
        <button class="btn" id="save-png-btn">💾 Save Image</button>
        <button class="btn" id="save-json-btn">💬 Export Comments</button>
    </div>

    <script type="module" src="./js/libs/pdfjs/pdf.mjs"></script>
    <script type="module" src="./js/app.js"></script>

</body>

</html>
